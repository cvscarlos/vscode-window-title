name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The suite runs inside a real VS Code instance, which needs a display.
      - name: Test
        run: xvfb-run -a npm test

      # Catches a manifest that cannot be packaged before it reaches a release.
      - name: Package
        run: npx @vscode/vsce package --out tmp/
